name: cavia_music
description: "A lightweight, premium music player with Japanese Ink × Liquid Glass aesthetic."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.8
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
